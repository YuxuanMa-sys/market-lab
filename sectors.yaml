# 板块分类：两层。大板块用于收盘总结，细分板块标在每只票上（watchlist.yaml 的 sector 字段填细分名）。
#
# 怎么分的（2026-11-04）：以 GICS 行业为底保证不漏，再按"实际交易时是否同涨同跌"拆开或合并。
# 用 231 只票过去 250 个交易日的市场残差收益（减掉 beta×SPY）验证：
#   本分类的细分内部平均相关 0.47，细分之间 0.02；GICS 11 大类内部只有 0.16。
# 所以 AI 硬件拆成几个大家确实一起动的小组，Shopify 算软件不算电商，大型生物药算大药，
# 家得宝/宣伟跟房屋建筑商放一起。"巨头"内部相关低是正常的：它们自己就是大盘，残差里看不出同涨同跌。
#
# etf：只作参照（观察池是等权，ETF 是市值权重，两者可以不一样）；没有合适 ETF 的留空。
