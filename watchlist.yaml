# 观察池：每天盘前/盘后报告和盘中提醒都看这里的票。一行一只，按板块分组，要加票就照抄一行。
#   symbol    代码。伯克希尔这类写 BRK-B（用连字符）。
#   sector    细分板块，必须是 sectors.yaml 里列出的名字。
#   note      一句话说明是什么公司，只写事实。
#   earnings  财报日 YYYY-MM-DD（可选）。只在财报日历查不到时才填；人工值会覆盖日历值，填错会压掉正确日期。
#
# 持仓不在这里维护，只看 holdings.txt。
#
# 选票办法（2026-11-04）：保留之前的票，每个细分再按成交额补上龙头。没有按"值不值得买"挑：
