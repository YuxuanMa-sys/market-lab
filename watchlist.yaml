# 自选股清单：每天盘前/盘后报告会逐个分析这里的票。
#
# order_style: 挂单风格（券商能力适配）
#   hybrid  = 混合方案（当前）：止损单常挂兜底，止盈不挂单由盘中提醒手动兑现
#   single  = 单笔全仓：每仓一张卖单，按"就近原则"挂
#             止损或止盈側，另一侧由盘中提醒监控；止盈=成本×1.10(回测最优)
#   oco     = 若券商支持OCO条件单(Fidelity网页版 Trade→Conditional)：止损+止盈同挂互斥
#   tranche = 分批模式（1/3梯次，适合股数多的大账户）
order_style: hybrid
#
# 每只票可选字段：
#   mode: swing | trend | event    策略模式，不填默认 swing
#     swing = 抄底波段：触发进场(抄底分≥55)，TP止盈，破无效位认错
#     trend = 趋势长拿：不设固定止盈，只在趋势破坏时提示离场（给你信仰的核心票）
#     event = 财报事件票：同 swing 触发，但要求先确认暴跌是过度反应而非基本面恶化
#   cost: 你的平均成本    填了就视为【持仓】，报告会给卖出侧建议（止盈/认错/轮动/财报降风险）
#   pct: 该持仓占账户总值的百分比（如 8.5）——填了才能做仓位管理：卖单换算成仓位%、
#        簇集中度检查、总开放风险仪表盘。账户总金额另存本地 account.yaml（不进 git）
#   since: 买入日期 YYYY-MM-DD（可选）——填了才能启用时间止损监控：
#          持仓约15个交易日仍未到TP1会提示离场换弹（回测：超时滞留仓位期望为负）
#   shares: 数量（可选，仅展示用）
#   note: 备注，原样显示在报告里
#
# 示例：
#   - symbol: NVDA
#     mode: trend
#     cost: 155.5
#     note: "AI核心仓"
